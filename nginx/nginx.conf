events {
    worker_connections 1024;
}

http {
    upstream app_backend {
        # round-robin par défaut (aucune directive supplémentaire nécessaire)
        server app1:8000 max_fails=2 fail_timeout=10s;
        server app2:8000 max_fails=2 fail_timeout=10s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://app_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Bascule immédiate vers un autre backend en cas d'échec
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        location /nginx_status {
            stub_status on;
            allow 127.0.0.1;
            deny all;
        }
    }
}

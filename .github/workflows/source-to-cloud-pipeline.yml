name: SourceToCloud CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/source-to-cloud-app

jobs:

  # ==========================================
  # 1. TEST
  # ==========================================
      lint-test:
    name: Tests and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install flake8

      - name: Run flake8
        run: |
          flake8 app

      - name: Run tests
        run: |
          pytest app/test_app.py

  # ==========================================
  # 2. DOCKER BUILD + SECURITY SCAN
  # ==========================================
  build-and-scan:
    name: Docker Build and Trivy Scan
    runs-on: ubuntu-latest
    needs: lint-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t source-to-cloud-app:scan-${{ github.sha }} \
            ./app

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: source-to-cloud-app:scan-${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true


  # ==========================================
  # 3. PUSH IMAGE TO GHCR
  # ==========================================
  build-push:
    name: Build and Push to GHCR
    runs-on: ubuntu-latest
    needs: build-and-scan

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest


  # ==========================================
  # 4. DEPLOY TO AZURE
  # ==========================================
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: build-push

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Add Azure host to known_hosts
        run: |
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy application
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'

          cd ~/source-to-cloud

          docker pull ghcr.io/${{ github.repository_owner }}/source-to-cloud-app:latest

          docker compose up -d app1

          sleep 5

          docker compose up -d app2

          docker image prune -f

          EOF